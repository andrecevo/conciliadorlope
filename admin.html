<style>
:root{--navy:#072758;--orange:#FF7100;--orangeH:#e66600;--cyan:#1382B1;--bg:#f2f4f8;--line:#dfe4ec;--line2:#edf0f5;--ink:#1d2433;--ink2:#4f5b6b;--ink3:#69727d;--ok:#0f7b3f;--okS:#e6f4ec;--bad:#b42318;--badS:#fdeceb;--warn:#a15c00;--warnS:#fdf1dc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--orange);color:#fff}button:hover{background:var(--orangeH)}button:disabled{opacity:.6;cursor:default}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}button.sec:hover{border-color:#b9c3d3}
button.link{background:none;color:var(--cyan);padding:0;font-weight:500}button.link:hover{text-decoration:underline;background:none}
input,select,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(19,130,177,.35);border-color:var(--cyan)}
label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
.msg{font-size:13px;border-radius:10px;padding:9px 12px;margin-top:12px;display:none}.msg.err{display:block;background:var(--badS);color:var(--bad)}.msg.ok{display:block;background:var(--okS);color:var(--ok)}

body{background:var(--bg);font-size:13px}
.hero{background:radial-gradient(120% 180% at 50% 135%, #1382B1 0%, #0b3a78 42%, #072758 72%);color:#fff}
.in{max-width:1180px;margin:0 auto;padding:0 20px}
.hero .in{display:flex;align-items:center;gap:18px;padding-top:20px;padding-bottom:22px}
.hero img{height:30px}.hero .sep{width:1px;height:34px;background:rgba(255,255,255,.25)}
.hero h1{margin:0;font-size:20px;font-weight:800}.hero p{margin:2px 0 0;font-size:12px;color:rgba(255,255,255,.75)}
.hero .r{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12px}.hero a{color:#fff;font-weight:600;text-decoration:none}.hero a:hover{color:var(--orange)}
main{padding-top:18px;padding-bottom:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:800;color:var(--navy)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink3);font-weight:500;text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line2);vertical-align:top;overflow:hidden;text-overflow:ellipsis}
td.nw{white-space:nowrap}
tr.hl td{background:#fff6ee}
.pill{display:inline-block;font-size:11px;border-radius:10px;padding:1px 8px;background:var(--line2);color:var(--ink2)}.pill.ok{background:var(--okS);color:var(--ok)}.pill.bad{background:var(--badS);color:var(--bad)}.pill.warn{background:var(--warnS);color:var(--warn)}
.ap2{display:flex;gap:6px;align-items:center}.ap2 select{width:130px;padding:6px 8px;font-size:12px}.ap2 button{padding:6px 10px;font-size:12px;white-space:nowrap}
.ap input,.ap select{padding:6px 8px;font-size:12px}
.ap button{padding:6px 10px;font-size:12px}
.acts button{padding:5px 9px;font-size:12px;margin-right:4px}
.muted{color:var(--ink3)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9}
.lg{max-width:380px;margin:60px auto}
.modal{position:fixed;inset:0;background:rgba(7,39,88,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(3,15,40,.35)}
.modal h3{margin:0 0 6px;color:var(--navy);font-size:16px;font-weight:800}
.modal p{margin:6px 0;color:var(--ink2)}
.modal textarea{font-size:12px;margin-top:8px;resize:none}
.modal .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.nu{display:grid;grid-template-columns:1fr 1.3fr 150px auto;gap:8px;align-items:end}
.nu label{margin-top:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{background:none;color:var(--ink2);border-radius:0;border-bottom:2px solid transparent;padding:9px 13px;font-weight:500}.tabs button.on{color:var(--navy);border-bottom-color:var(--orange);font-weight:700}
</style></head>

<script>
(function(){
'use strict';
const C=window.CG_CONFIG||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=s=>{ if(!s) return ''; const d=new Date(s); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
const toast=t=>{ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',3600); };
const solId=new URLSearchParams(location.search).get('sol');
const sb=window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, {auth:{flowType:'implicit', persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}});
let EU=null, D=null, aba='pedidos';
function irLogin(){ sessionStorage.setItem('cg_volta', location.href); location.href='./'; }
$('#sair').onclick=async e=>{ e.preventDefault(); await sb.auth.signOut(); location.href='./'; };
async function fn(body){
  const { data, error } = await sb.functions.invoke('acesso-admin', { body });
  if(error){ let m=error.message; try{ const j=await error.context.json(); if(j.sessao===false){ irLogin(); } m=j.erro||m; }catch(e){} throw new Error(m); }
  if(!data || !data.ok) throw new Error((data&&data.erro)||'Erro no servidor');
  return data;
}
async function dados(){
  const [s,p,h]=await Promise.all([
    sb.from('solicitacoes').select('*').order('criado_em',{ascending:false}),
    sb.from('perfis').select('*').order('nome'),
    sb.from('historico').select('*').order('id',{ascending:false}).limit(300)]);
  const err=s.error||p.error||h.error; if(err) throw new Error(err.message);
  D={sol:s.data, usu:p.data, hist:h.data};
}
async function carregar(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ irLogin(); return; }
  const { data:p } = await sb.from('perfis').select('id,nome,papel,ativo').eq('id',session.user.id).maybeSingle();
  if(!p || !p.ativo || p.papel!=='admin'){ $('#app').innerHTML='<div class="card lg"><h2>Sem permissão</h2><p class="muted">Só administradores acessam esta página.</p><p><a href="./">Voltar para a Conciliação</a></p></div>'; return; }
  EU=p; $('#quem').textContent=p.nome||session.user.email;
  try{ await dados(); render(); }catch(e){ toast(e.message); }
}
function render(){
  const pend=D.sol.filter(s=>s.status==='Pendente'), nomeDe=id=>{ const u=D.usu.find(x=>x.id===id); return u?u.nome:''; };
  let h='<div class="tabs">'+[['pedidos','Pedidos pendentes ('+pend.length+')'],['usuarios','Usuários ('+D.usu.length+')'],['analisados','Pedidos analisados'],['hist','Histórico']].map(([k,l])=>'<button data-a="'+k+'" class="'+(aba===k?'on':'')+'">'+l+'</button>').join('')+'</div>';
  if(aba==='pedidos'){
    h+='<div class="card"><h2>Pedidos de acesso</h2>';
    if(!pend.length) h+='<p class="muted">Nenhum pedido pendente.</p>';
    else{
      h+='<table><colgroup><col style="width:13%"><col style="width:24%"><col><col style="width:34%"></colgroup><thead><tr><th>Data</th><th>Pessoa</th><th>Área · motivo</th><th>Papel e decisão</th></tr></thead><tbody>';
      pend.forEach(s=>{ h+='<tr class="'+(s.id===solId?'hl':'')+'" id="s-'+esc(s.id)+'"><td class="nw">'+dt(s.criado_em)+'</td><td><b>'+esc(s.nome)+'</b><br><span class="muted">'+esc(s.email)+'</span></td><td>'+esc(s.area||'—')+'<br><span class="muted">'+esc(s.motivo||'')+'</span></td><td><div class="ap2"><select data-r><option value="usuario">Usuário</option><option value="admin">Administrador</option></select><button data-ok="'+esc(s.id)+'">Aprovar e enviar convite</button><button class="sec" data-no="'+esc(s.id)+'">Negar</button></div></td></tr>'; });
      h+='</tbody></table><p class="muted" style="margin:10px 0 0">Ao aprovar, sai o convite para a pessoa criar a própria senha. Se o e-mail não puder ser enviado, o link aparece aqui para você copiar.</p>';
    }
    h+='</div>';
  }
  if(aba==='usuarios'){
    h+='<div class="card"><h2>Convidar usuário</h2><div class="nu"><div><label>Nome</label><input id="nuN"></div><div><label>E-mail</label><input id="nuE" type="email"></div><div><label>Papel</label><select id="nuR"><option value="usuario">Usuário</option><option value="admin">Administrador</option></select></div><div><button id="nuB">Enviar convite</button></div></div></div>';
    h+='<div class="card"><h2>Usuários</h2><table><colgroup><col style="width:18%"><col style="width:24%"><col style="width:12%"><col style="width:9%"><col style="width:13%"><col></colgroup><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Situação</th><th>Último acesso</th><th></th></tr></thead><tbody>';
    D.usu.forEach(u=>{ const eu=u.id===EU.id; h+='<tr><td><b>'+esc(u.nome)+'</b>'+(eu?' <span class="muted">(você)</span>':'')+'</td><td>'+esc(u.email)+'</td><td>'+(u.papel==='admin'?'<span class="pill warn">Administrador</span>':'<span class="pill">Usuário</span>')+'</td><td>'+(u.ativo?'<span class="pill ok">Ativo</span>':'<span class="pill bad">Inativo</span>')+'</td><td class="nw">'+(u.ultimo_acesso?dt(u.ultimo_acesso):'<span class="muted">nunca</span>')+'</td><td class="acts"><button class="sec" data-rs="'+esc(u.id)+'">Gerar link de senha</button>'+(eu?'':'<button class="sec" data-pp="'+esc(u.id)+'" data-v="'+(u.papel==='admin'?'usuario':'admin')+'">'+(u.papel==='admin'?'Tirar admin':'Tornar admin')+'</button><button class="sec" data-at="'+esc(u.id)+'" data-v="'+(u.ativo?'0':'1')+'">'+(u.ativo?'Desativar':'Reativar')+'</button>')+'</td></tr>'; });
    h+='</tbody></table></div>';
  }
  if(aba==='analisados'){
    const an=D.sol.filter(s=>s.status!=='Pendente');
    h+='<div class="card"><h2>Pedidos analisados</h2><table><colgroup><col style="width:14%"><col style="width:30%"><col style="width:14%"><col style="width:20%"><col></colgroup><thead><tr><th>Data</th><th>Pessoa</th><th>Resultado</th><th>Analisado por</th><th>Em</th></tr></thead><tbody>'+(an.length?an.map(s=>'<tr><td class="nw">'+dt(s.criado_em)+'</td><td>'+esc(s.nome)+'<br><span class="muted">'+esc(s.email)+'</span></td><td>'+(s.status==='Aprovada'?'<span class="pill ok">Aprovada</span>':'<span class="pill bad">Negada</span>')+'</td><td>'+esc(nomeDe(s.analisado_por))+'</td><td class="nw">'+dt(s.analisado_em)+'</td></tr>').join(''):'<tr><td colspan="5" class="muted">Nenhum pedido analisado ainda.</td></tr>')+'</tbody></table></div>';
  }
  if(aba==='hist'){
    h+='<div class="card"><h2>Histórico</h2><table><colgroup><col style="width:15%"><col style="width:18%"><col style="width:18%"><col></colgroup><thead><tr><th>Quando</th><th>Quem</th><th>O que</th><th>Detalhe</th></tr></thead><tbody>'+(D.hist.length?D.hist.map(x=>'<tr><td class="nw">'+dt(x.em)+'</td><td>'+esc(x.usuario_nome||'—')+'</td><td>'+esc(x.acao)+'</td><td title="'+esc(x.detalhe)+'" style="white-space:nowrap">'+esc(x.detalhe)+'</td></tr>').join(''):'<tr><td colspan="4" class="muted">Sem registros.</td></tr>')+'</tbody></table><p class="muted" style="margin:10px 0 0">Últimos 300 registros.</p></div>';
  }
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ aba=b.dataset.a; render(); });
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>acao(b,()=>({acao:'aprovar', id:b.dataset.ok, papel:b.closest('tr').querySelector('[data-r]').value}),'Acesso aprovado. O convite foi enviado por e-mail.'));
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>{ if(!b.dataset.c){ b.dataset.c=1; b.textContent='Confirmar'; return; } acao(b,()=>({acao:'negar', id:b.dataset.no, avisar:true}),'Pedido negado. A pessoa foi avisada por e-mail.'); });
  document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>acao(b,()=>({acao:'reenviar', user_id:b.dataset.rs}),'Link de senha nova enviado por e-mail.'));
  document.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>acao(b,()=>({acao:'papel', user_id:b.dataset.pp, papel:b.dataset.v}),'Papel alterado.'));
  document.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{ if(b.dataset.v==='0' && !b.dataset.c){ b.dataset.c=1; b.textContent='Confirmar'; return; } acao(b,()=>({acao:'ativo', user_id:b.dataset.at, ativo:b.dataset.v==='1'}),'Situação alterada.'); });
  const nb=$('#nuB'); if(nb) nb.onclick=()=>acao(nb,()=>({acao:'convidar', nome:$('#nuN').value, email:$('#nuE').value, papel:$('#nuR').value}),'Convite enviado por e-mail.');
  if(solId){ const el=document.getElementById('s-'+solId); if(el) el.scrollIntoView({block:'center'}); }
}
async function acao(btn, body, ok){
  btn.disabled=true;
  try{
    const r=await fn(body());
    if(r.link && !r.enviado) mostraLink(r); else toast(ok);
    await dados(); render();
  }
  catch(e){ toast(e.message); btn.disabled=false; }
}
function mostraLink(r){
  $('#mT').textContent='Envie o link para '+(r.nome||r.email);
  $('#mP').innerHTML='O e-mail não pôde ser enviado: sem domínio verificado, o Resend só entrega na conta dona dele. Copie o link abaixo e mande para <b>'+esc(r.email)+'</b> por WhatsApp ou pelo seu e-mail. Com ele a pessoa cria a senha e entra. O link vale uma vez e por tempo limitado.';
  $('#mL').value=r.link; $('#modal').style.display='flex';
}
$('#mF').onclick=()=>{ $('#modal').style.display='none'; };
$('#mC').onclick=async()=>{ try{ await navigator.clipboard.writeText($('#mL').value); toast('Link copiado'); }catch(e){ $('#mL').select(); document.execCommand('copy'); toast('Link copiado'); } };
carregar();
})();
</script>
